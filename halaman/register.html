    <script>
      // SVG Icon Mata Terbuka & Mata Tertutup
      const eyeOpenIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`;
      const eyeClosedIcon = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a8.98 8.98 0 013.682-.783c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21m-4.225-4.225L3 3m9 8a3 3 0 013 3m0 0l-3-3" /></svg>`;

      // Fungsi Toggle Intip Password
      function setupToggleLiatPassword(inputId, buttonId) {
        const input = document.getElementById(inputId);
        const button = document.getElementById(buttonId);

        if (input && button) {
          button.addEventListener("click", () => {
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            button.innerHTML = isPassword ? eyeOpenIcon : eyeClosedIcon;
          });
        }
      }

      // Jalankan fungsi toggle untuk kedua field password
      setupToggleLiatPassword("password", "toggleLiatPassword");
      setupToggleLiatPassword("confirm_password", "toggleLiatConfirmPassword");

      // Validasi Kata Sandi Harus Sama saat Form Dikirim
      const formRegister = document.querySelector("form");
      if (formRegister) {
        formRegister.addEventListener("submit", (e) => {
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirm_password").value;

          if (password !== confirmPassword) {
            e.preventDefault(); // Batalkan pengiriman form
            alert(
              "Kata sandi dan Ulangi kata sandi tidak cocok! Silakan periksa kembali.",
            );
          }
        });
      }
